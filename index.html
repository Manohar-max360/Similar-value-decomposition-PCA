<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fixed Scatter Plot Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
            max-width: 300px;
        }
        h3 { margin-top: 0; color: #4dadff; font-size: 1.2rem; }
        p { font-size: 0.85rem; color: #aaa; line-height: 1.4; }
        button {
            background: #4dadff;
            color: #111116;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #3593e6; }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Include Three.js and OrbitControls via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <h3>3D Scatter Simulator</h3>
        <p><strong>Fixed Data Points:</strong> 100</p>
        <p><strong>Interaction:</strong> Left-click and drag to rotate the view camera around the 3D axis system. Right-click to pan. Scroll to zoom.</p>
        <button id="regenerate-btn">Regenerate Data</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- Configuration ---
        const totalPoints = 100;
        const boxSize = 40; // Spatial bounds of the plot (-20 to 20)

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 35, 50);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Orbit Controls (Rotates camera around the entire axis)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // Ambient and Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 60, 20);
        scene.add(dirLight);

        // --- Visual Plot Elements Group ---
        // Placing everything in one group ensures physical spatial consistency
        const plotGroup = new THREE.Group();
        scene.add(plotGroup);

        // 1. Grid Boundaries & Axis Lines
        const axisHelper = new THREE.AxesHelper(boxSize / 2 + 5);
        plotGroup.add(axisHelper); // Red = X, Green = Y, Blue = Z

        // Outer reference bounding box cage
        const cageGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const cageMat = new THREE.MeshBasicMaterial({
            color: 0x444455,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const cage = new THREE.Mesh(cageGeo, cageMat);
        plotGroup.add(cage);

        // 2. Generating Fixed Data Points
        let pointsMesh;

        function generateScatterPoints() {
            // Remove previous points if they exist
            if (pointsMesh) plotGroup.remove(pointsMesh);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(totalPoints * 3);
            const colors = new Float32Array(totalPoints * 3);

            const colorOptions = [
                new THREE.Color(0x4dadff), // Cyan/Blue
                new THREE.Color(0xff4d4d), // Red
                new THREE.Color(0x4dff88)  // Green
            ];

            for (let i = 0; i < totalPoints; i++) {
                // Fixed random coordinates bounded inside our cage matrix (-20 to 20)
                const x = (Math.random() - 0.5) * boxSize;
                const y = (Math.random() - 0.5) * boxSize;
                const z = (Math.random() - 0.5) * boxSize;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color mapping based on position quadrant for visual depth
                const baseColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i * 3] = baseColor.r;
                colors[i * 3 + 1] = baseColor.g;
                colors[i * 3 + 2] = baseColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // High-performance particle material using custom circles
            const texture = createCircleTexture();
            const material = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                map: texture,
                transparent: true,
                alphaTest: 0.5,
                depthWrite: true
            });

            pointsMesh = new THREE.Points(geometry, material);
            plotGroup.add(pointsMesh);
        }

        // Helper function to generate smooth circular point particles
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.8, 'rgba(255,255,255,0.8)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // Initialize points
        generateScatterPoints();

        // Button Event Listener
        document.getElementById('regenerate-btn').addEventListener('click', generateScatterPoints);

        // --- Window Resizing ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Required to update camera position seamlessly during drag interaction
            controls.update(); 
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
